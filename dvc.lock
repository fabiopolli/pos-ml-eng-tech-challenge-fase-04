        - BILL_AMT4
        - BILL_AMT5
        - BILL_AMT6
        - PAY_AMT1
        - PAY_AMT2
        - PAY_AMT3
        - PAY_AMT4
        - PAY_AMT5
        - PAY_AMT6
        modeling:
          primary_metric: roc_auc
          secondary_metrics:
          - precision
          - recall
          - f1
          - accuracy
          candidates:
          - logistic_regression
          - random_forest
          baseline: logistic_regression
          tie_break: baseline
          logistic_regression:
            C: 1.0
            max_iter: 1000
            class_weight: balanced
          random_forest:
            n_estimators: 300
            max_depth: 8
            min_samples_leaf: 20
            class_weight: balanced_subsample
            n_jobs: -1
