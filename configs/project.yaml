project:
  name: credit-scoring-fase-04
  random_seed: 42

dataset:
  source: local_csv
  origin: uci_350
  raw_file: default_of_credit_card_clients.csv
  csv:
    sep: ";"
    header_row: 1
  target_column_raw: default payment next month
  canonical_target: default_payment_next_month
  id_column: ID
  acquisition:
    xls_file: default of credit card clients.xls
    sheet: Data
    header_row: 1
    sep: ";"
    lineterminator: "\r\n"
    placeholder_columns: 23
    expected_xls_md5: c0a9cb828ded9c446574ede877bf1f6e
    expected_csv_md5: a6ee086d1eafba5566f666b3ff2ed2c9
    expected_csv_sha256: 1fc7fe04822413cf48d0f5ca974cbe47061b21ea10fa1d114bb56b8feac79358
    source_url: https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients
    doi: 10.24432/C55S3H
    license: CC BY 4.0
    citation: >-
      Yeh, I. (2009). Default of Credit Card Clients [Dataset]. UCI Machine Learning
      Repository. https://doi.org/10.24432/C55S3H
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
  financial_features:
    - LIMIT_BAL
    - PAY_0
    - PAY_2
    - PAY_3
    - PAY_4
    - PAY_5
    - PAY_6
    - BILL_AMT1
    - BILL_AMT2
    - BILL_AMT3
    - BILL_AMT4
    - BILL_AMT5
    - BILL_AMT6
    - PAY_AMT1
    - PAY_AMT2
    - PAY_AMT3
    - PAY_AMT4
    - PAY_AMT5
    - PAY_AMT6
  governance_features:
    - SEX
    - EDUCATION
    - MARRIAGE
    - AGE

modeling:
  primary_metric: roc_auc
  secondary_metrics: [precision, recall, f1, accuracy]
  candidates: [logistic_regression, random_forest]
  baseline: logistic_regression
  tie_break: baseline
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 20
    class_weight: balanced_subsample
    n_jobs: -1

contract:
  age_min: 18
  age_max: 100
  require_unique_id: true
  require_positive_limit_bal: true
  reject_null_features: true

drift:
  features_to_shift: [LIMIT_BAL, PAY_AMT1]
  alpha: 0.05

