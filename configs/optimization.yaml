# Protocolo da campanha de otimizacao dos modelos (plano 1.6).
#
# Este arquivo congela o protocolo ANTES de qualquer ajuste: os valores abaixo sao
# escolhas do plano, nao benchmarks externos nem resultados garantidos. O manifesto
# gravado em reports/optimization/<experiment_id>/tuning/manifest.json copia esta
# configuracao junto dos hashes das entradas, das versoes e da lista efetiva de
# trials, e nao e reescrito depois dos resultados.
#
# A campanha le SOMENTE data/processed/train.csv. A validacao e o teste ficam fora
# da busca; o teste nunca participa de ajuste, selecao ou promocao.

optimization:
  protocol_version: "1.6.0"
  experiment_id: "opt-20261026-01"
  # Metrica primaria: ROC-AUC de probabilidades para a classe 1 (inadimplencia).
  primary_metric: roc_auc
  threshold: 0.5
  #cv
  folds:
    n_splits: 5
    shuffle: true
    random_state: 42
  seeds:
    primary: 42
    # Sementes do estimador usadas apenas na checagem de estabilidade do RF.
    stability: [17, 73]
  # Orçamento de ajustes (fits) da campanha. O teto e do plano; nao e estimativa
  # de duracao medida.
  budget:
    max_fits: 220
  # Criterios de promocao, aplicados na rodada unica de validacao (secao 3 do plano).
  criteria:
    # Ganho minimo do ROC-AUC de validacao sobre o RF vigente.
    min_gain_validation: 0.010
    # Ganho minimo da ROC-AUC media de CV sobre o controle da mesma familia.
    min_gain_cv_mean: 0.005
    # Ganho minimo da variante com razoes sobre a variante sem razoes.
    min_ablation_gain: 0.005
    # Intervalo pareado por bootstrap: 97,5% por comparacao (Bonferroni para 95% familiar).
    ci_level: 0.95
    bootstrap_resamples: 2000
    bootstrap_seed: 42
  # Espaco de busca. Os controles atuais (configs/project.yaml) seguem elegiveis.
  search:
    random_forest:
      n_draws: 24
      sampler_seed: 42
      # criterion=gini, bootstrap=True e semente 42 sao fixos no codigo.
      grid:
        n_estimators: [200, 300, 600]
        max_depth: [6, 8, 12, 16, null]
        min_samples_leaf: [1, 2, 5, 10, 20, 40]
        min_samples_split: [2, 10, 20]
        max_features: ["sqrt", 0.5, 1.0]
        class_weight: [null, "balanced", "balanced_subsample"]
    logistic_regression:
      # Grade completa de 12 configuracoes: 6 valores de C x 2 de class_weight.
      C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      class_weight: [null, "balanced"]
      solver: lbfgs
      penalty: l2
      max_iter: 5000
  # Unica variante pre-definida de features testada na ablacao (secao 4.3 do plano).
  ratio_features:
    min_denominator: 1.0
    names:
      - bill_amt1_over_limit_bal
      - pay_amt1_over_limit_bal
      - pay_amt1_over_abs_bill_amt1
  # Ajustes do RF durante a CV: um worker/thread, para reprodutibilidade.
  n_jobs: 1
