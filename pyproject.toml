[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-ml-eng-tech-challenge-fase-04"
version = "0.1.0"
description = "Credit scoring com contratos de dados, deteccao de drift e observabilidade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.26,<1",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "xlrd>=2,<3",
]

# Dependencias de fases futuras: declaradas, porem NAO instaladas por padrao.
# A reavaliacao pedida pela acao 2 da 1.1a separou "instalado" de
# "implementado": o ambiente padrao carrega apenas o que o codigo da fase
# usa, e cada fase instala o seu extra quando precisar.
#
#   uv sync --dev --locked --extra drift          # fase 2 (evidently)
#   uv sync --dev --locked --extra observability  # fase 3 (mlflow, streamlit)
#   uv sync --dev --locked --extra provenance     # reverificar a fonte na UCI
#   uv sync --dev --locked --extra model_lab      # laboratorio de modelos (plano 1.6)
[project.optional-dependencies]
drift = ["evidently>=0.7,<1"]
observability = ["mlflow>=3,<4", "streamlit>=1.40,<2"]
provenance = ["ucimlrepo>=0.0.7,<1"]
model_lab = ["streamlit>=1.40,<2"]

[project.scripts]
credit-monitoring-acquire = "credit_monitoring.data.acquire:main"
credit-monitoring-eda = "credit_monitoring.eda:main"
credit-monitoring-prepare = "credit_monitoring.data.prepare:main"
credit-monitoring-train = "credit_monitoring.models.train:main"
credit-monitoring-tune = "credit_monitoring.models.tune:main"
credit-monitoring-evaluate = "credit_monitoring.models.evaluate:main"
credit-monitoring-validate = "credit_monitoring.contracts.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "dvc[s3]>=3,<4",
    "ipykernel>=6.29,<7",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

