[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-ml-eng-tech-challenge-fase-04"
version = "0.1.0"
description = "Credit scoring com contratos de dados, deteccao de drift e observabilidade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mlflow>=3,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.26,<1",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "streamlit>=1.40,<2",
    "ucimlrepo>=0.0.7,<1",
    "xlrd>=2,<3",
]

[project.scripts]
credit-monitoring-eda = "credit_monitoring.eda:main"
credit-monitoring-prepare = "credit_monitoring.data.prepare:main"
credit-monitoring-train = "credit_monitoring.models.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "dvc[s3]>=3,<4",
    "ipykernel>=6.29,<7",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

