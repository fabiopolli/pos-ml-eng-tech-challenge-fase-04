stages:
  acquire:
    cmd: python -m credit_monitoring.data.acquire
    deps:
      - data/default of credit card clients.xls
      - src/credit_monitoring/data/acquire.py
      - src/credit_monitoring/config.py
    params:
      - configs/project.yaml:
          - dataset.raw_file
          - dataset.acquisition
    outs:
      - data/raw/default_of_credit_card_clients.csv
      - reports/acquisition_provenance.json:
          cache: false

  eda:
    cmd: python -m credit_monitoring.eda
    deps:
      - data/raw/default_of_credit_card_clients.csv
      - src/credit_monitoring/eda.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - dataset
    outs:
      - reports/eda/eda_summary.json:
          cache: false
      - reports/figures/eda

  prepare:
    cmd: python -m credit_monitoring.data.prepare
    deps:
      - data/raw/default_of_credit_card_clients.csv
      - reports/eda/eda_summary.json
      - src/credit_monitoring/data/prepare.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - project.random_seed
          - dataset
          - contract
    outs:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
      - data/processed/preparation_report.json
      - data/reference/reference.csv

  explore:
    cmd: python -m credit_monitoring.explore
    deps:
      - data/processed/train.csv
      - src/credit_monitoring/explore.py
      - src/credit_monitoring/config.py
    params:
      - configs/project.yaml:
          - dataset.financial_features
          - dataset.canonical_target
    outs:
      - reports/explore/train_exploration.json:
          cache: false
      - reports/figures/explore

  tune:
    cmd: python -m credit_monitoring.models.tune
    deps:
      - data/processed/train.csv
      - src/credit_monitoring/models/tune.py
      - src/credit_monitoring/models/features.py
      - src/credit_monitoring/models/metrics.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/contracts
    params:
      - configs/project.yaml:
          - project.random_seed
          - dataset.financial_features
          - dataset.canonical_target
          - contract
          - modeling
      - configs/optimization.yaml:
          - optimization
    outs:
      - reports/optimization/opt-20261026-01/tuning:
          cache: false
      - models/optimization/opt-20261026-01/finalists

  train:
    cmd: python -m credit_monitoring.models.train --optimization-config configs/optimization.yaml
    deps:
      - data/processed/train.csv
      - data/processed/validation.csv
      - src/credit_monitoring/models/train.py
      - src/credit_monitoring/models/metrics.py
      - src/credit_monitoring/models/promotion.py
      - src/credit_monitoring/models/features.py
      - src/credit_monitoring/models/tune.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/contracts
      - configs/optimization.yaml
      - reports/optimization/opt-20261026-01/tuning
      - models/optimization/opt-20261026-01/finalists
    params:
      - configs/project.yaml:
          - project.random_seed
          - dataset.financial_features
          - dataset.canonical_target
          - contract
          - modeling
      - configs/optimization.yaml:
          - optimization
    outs:
      - models/credit_model.joblib
      - models/credit_model_metadata.json
      - models/candidates
      - models/optimization/opt-20261026-01/incumbent
      - models/optimization/opt-20261026-01/selection
      - reports/optimization/opt-20261026-01/selection:
          cache: false
      - reports/figures/model
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python -m credit_monitoring.models.evaluate
    deps:
      - data/processed/test.csv
      - models/credit_model.joblib
      - models/credit_model_metadata.json
      - src/credit_monitoring/models/evaluate.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/contracts
    params:
      - configs/project.yaml:
          - dataset.financial_features
          - dataset.canonical_target
          - contract
          - modeling.primary_metric
    outs:
      - reports/test_metrics.json:
          cache: false

  simulate_production:
    cmd: python -m credit_monitoring.data.simulate
    deps:
      - data/processed/validation.csv
      - data/reference/reference.csv
      - models/credit_model_metadata.json
      - src/credit_monitoring/data/simulate.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/contracts
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - dataset.canonical_target
          - dataset.financial_features
          - dataset.governance_features
          - dataset.id_column
          - drift
    outs:
      - data/production/v1.0.2/original.csv
      - data/production/v1.0.2/modified.csv
      - data/production/v1.0.2/manifest.json

  score_production:
    cmd: python -m credit_monitoring.models.score_production
    deps:
      - data/production/v1.0.2/original.csv
      - data/production/v1.0.2/modified.csv
      - data/production/v1.0.2/manifest.json
      - models/credit_model.joblib
      - models/credit_model_metadata.json
      - src/credit_monitoring/models/score_production.py
      - src/credit_monitoring/models/inference.py
      - src/credit_monitoring/models/metrics.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/data/loading.py
      - src/credit_monitoring/data/simulate.py
      - src/credit_monitoring/contracts
    params:
      - configs/project.yaml:
          - dataset.financial_features
          - dataset.canonical_target
          - contract
          - modeling
          - drift.scoring
    outs:
      - data/production/v1.0.2/predictions/original.csv
      - data/production/v1.0.2/predictions/modified.csv
      - reports/drift/prediction_summary-v1.0.2.json

  detect_drift:
    cmd: python -m credit_monitoring.monitoring.drift
    deps:
      - data/reference/reference.csv
      - data/production/v1.0.2/original.csv
      - data/production/v1.0.2/modified.csv
      - data/production/v1.0.2/manifest.json
      - reports/drift/prediction_summary-v1.0.2.json
      - models/credit_model_metadata.json
      - data/processed/preparation_report.json
      - reports/eda/eda_summary.json
      - reports/metrics.json
      - reports/test_metrics.json
      - reports/optimization/opt-20261026-01/tuning/manifest.json
      - reports/optimization/opt-20261026-01/selection/comparison.json
      - configs/optimization.yaml
      - docs/DATASET.md
      - src/credit_monitoring/models/train.py
      - src/credit_monitoring/models/tune.py
      - src/credit_monitoring/monitoring/drift.py
      - src/credit_monitoring/monitoring/report_context.py
      - src/credit_monitoring/monitoring/drift_report_template.html
      - src/credit_monitoring/config.py
      - src/credit_monitoring/contracts
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - dataset.acquisition.doi
          - dataset.acquisition.license
          - dataset.split
          - dataset.target_column_raw
          - dataset.canonical_target
          - dataset.financial_features
          - dataset.governance_features
          - dataset.id_column
          - drift
    outs:
      - reports/drift/results-v1.0.2.json:
          cache: false
      - reports/drift/phase-2-drift-v1.0.2-ptbr-v6.html
