stages:
  acquire:
    cmd: python -m credit_monitoring.data.acquire
    deps:
      - data/default of credit card clients.xls
      - src/credit_monitoring/data/acquire.py
      - src/credit_monitoring/config.py
    params:
      - configs/project.yaml:
          - dataset.raw_file
          - dataset.acquisition
    outs:
      - data/raw/default_of_credit_card_clients.csv
      - reports/acquisition_provenance.json:
          cache: false

  eda:
    cmd: python -m credit_monitoring.eda
    deps:
      - data/raw/default_of_credit_card_clients.csv
      - src/credit_monitoring/eda.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - dataset
    outs:
      - reports/eda/eda_summary.json:
          cache: false
      - reports/figures/eda

  prepare:
    cmd: python -m credit_monitoring.data.prepare
    deps:
      - data/raw/default_of_credit_card_clients.csv
      - reports/eda/eda_summary.json
      - src/credit_monitoring/data/prepare.py
      - src/credit_monitoring/config.py
      - src/credit_monitoring/data/loading.py
    params:
      - configs/project.yaml:
          - project.random_seed
          - dataset
          - contract
    outs:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
      - data/processed/preparation_report.json
      - data/reference/reference.csv

  explore:
    cmd: python -m credit_monitoring.explore
    deps:
      - data/processed/train.csv
      - src/credit_monitoring/explore.py
      - src/credit_monitoring/config.py
    params:
      - configs/project.yaml:
          - dataset.financial_features
          - dataset.canonical_target
    outs:
      - reports/explore/train_exploration.json:
          cache: false
      - reports/figures/explore

  train:
    cmd: python -m credit_monitoring.models.train
    deps:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
      - src/credit_monitoring/models/train.py
      - src/credit_monitoring/config.py
    params:
      - configs/project.yaml:
          - project.random_seed
          - dataset.financial_features
          - dataset.canonical_target
          - modeling
    outs:
      - models/credit_model.joblib
      - models/credit_model_metadata.json
      - reports/figures/model
    metrics:
      - reports/metrics.json:
          cache: false
